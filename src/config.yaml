        ebitda:
          unit: "USD"
          transform: "none"
          description: "Earnings before interest, taxes, depreciation, amortization."
          concept: "EarningsBeforeInterestTaxesDepreciationAndAmortization"
          alternatives:
            - "EBITDA"
            - "EarningsBeforeInterestTaxesDepreciationAndAmortizationNet"

        net_income:
          unit: "USD"
          transform: "none"
          description: "Profit after all expenses and taxes."
          concept: "NetIncomeLoss"
          alternatives:
            - "ProfitLoss"
            - "NetIncomeLossAvailableToCommonStockholdersBasic"


      balance_sheet_q:
        total_assets:
          unit: "USD"
          transform: "none"
          description: "Sum of current + non-current assets."
          concept: "Assets"
          alternatives:
            - "AssetsNoncurrent"
            - "AssetsCurrent"

        total_current_assets:
          unit: "USD"
          transform: "none"
          description: "Sum of all current assets."
          concept: "AssetsCurrent"
          alternatives:
            - "CurrentAssets"
            - "TotalCurrentAssets"

        cash_and_cash_equivalents:
          unit: "USD"
          transform: "none"
          description: "Cash on hand and in bank accounts."
          concept: "CashAndCashEquivalentsAtCarryingValue"
          alternatives:
            - "CashAndCashEquivalentsPeriodIncreaseDecrease"
            - "CashAndCashEquivalentsAndRestrictedCashAtCarryingValue"

        cash_and_short_term_investments:
          unit: "USD"
          transform: "none"
          description: "Cash plus marketable securities expected to convert to cash within one year."
          concept: "CashAndCashEquivalentsAtCarryingValue"
          alternatives:
            - "CashAndCashEquivalentsAndShortTermInvestments"
            - "CashAndShortTermInvestments"

        inventory:
