# ─── MODEL HYPERPARAMETERS ────────────────────────────────────────────────────────────────────────────────────────────
models:
  SARIMAX:
    order: [1, 0, 0]
    seasonal_order: [0, 0, 0, 0]
    ranges:
      p: [0, 2]
      d: [0, 1]
      q: [0, 2]
      P: [0, 2]
      D: [0, 1]
      Q: [0, 2]
      s: [5]
      max_combos: 4
    enforce_stationarity: False
    enforce_invertibility: False
    forecast_steps: 10
  # Auto-order SARIMAX (run #2): per-fold AIC search over p,q ∈ {0..p_max},
  # d fixed (target already stationary), seasonal_order=(0,0,0,0), no trend.
  # Reuses SARIMAX.enforce_* above. 9 candidates/fold at the defaults below.
  SARIMAX_AIC:
    p_max: 2
    q_max: 2
    d: 0
  VARMAX:
    order: [1, 0]
    endog_cols:
      - log_return
      - dji
      - gld
      - us_consumer_price_index
      - income_q_gross_profit_pctchg
    target_col: log_return
    ranges:
      p: [0, 2]
      q: [0, 2]
      max_combos: 4
    enforce_stationarity: False
    enforce_invertibility: False
    forecast_steps: 10
  LSTM:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
    lr: 0.001
    batch_size: 32
    epochs: 50          # was 10 — uniform 50 across all neural models (eng-review C1)
    seq_len: 20
    forecast_steps: 10
    ranges:
      hidden_size: [32, 64]
      num_layers: [1, 2]
      dropout: [0.0, 0.1]
      lr: [0.001, 0.0005]
      batch_size: [32, 64]
      seq_len: [20, 200]
      epochs: [10, 100]
      max_combos: 4
  LTC:
    units: 16
    lr: 0.005
    epochs: 50          # was 1 — uniform 50 across all neural models (eng-review C1)
    seq_len: 20
    clip_gradient: 1.0
    batch_size: 32
    sparsity_level: 0.5
    batch_first: True
    forecast_steps: 10
    ranges:
      units: [16, 128]
      lr: [0.01, 0.005]
      epochs: [1, 100]
      seq_len: [20, 200]
      sparsity_level: [0.1, 0.9]
      batch_size: [32, 64]
      clip_gradient: [1.0, 1.0]
      max_combos: 4
  CfC:
    units: 16
    lr: 0.005
    epochs: 50          # was 1 — uniform 50 across all neural models (eng-review C1)
    seq_len: 20
    clip_gradient: 1.0
    batch_size: 32
    sparsity_level: 0.5
    batch_first: True
    forecast_steps: 10
    ranges:
      units: [16, 128]
      lr: [0.01, 0.005]
      epochs: [1, 100]
      seq_len: [20, 200]
      sparsity_level: [0.1, 0.9]
      batch_size: [32, 64]
      clip_gradient: [1.0, 1.0]
      max_combos: 4

  # Continuous-time RNN (Funahashi & Nakamura, 1993). Walk-forward uses defaults.
  CTRNN:
    hidden_size: 32
    dt: 1.0
    lr: 0.005
    batch_size: 32
    seq_len: 20
    epochs: 50
    grad_clip: 1.0
    forecast_steps: 10

  # Neural ODE (Chen et al., 2018) with GRU encoder + latent ODE residual.
  # Default solver rk4 (4 RHS evals/step via options={"step_size": 0.25}).
  # dopri5 is smoke-validated only (see thesis methods), not in the full grid.
  NeuralODE:
