# ─── WALK-FORWARD EVALUATION ──────────────────────────────────────────────────────────────────────────────────────────
walk_forward:
  initial_window: 750       # first training window (trading days, ~3 years)
  horizon: 21               # test horizon per fold (trading days, ~1 month)
  output_dir: "results/walk_forward"


# ─── PREPROCESSING CONDITIONS ─────────────────────────────────────────────────────────────────────────────────────────
preprocessing:
  warmup_discard: 20          # rows discarded from the start of BOTH conditions (rolling-window NaN warmup)
  macro_lag: 1                # publication-delay shift applied to all FRED + index columns in both conditions
  scaler:
    transformed: "zscore"     # StandardScaler for Condition 1
    raw: "minmax"             # MinMaxScaler for Condition 2


# ─── EXPERIMENT SETUP ─────────────────────────────────────────────────────────────────────────────────────────────────
experiment:
  # Self-declared run identity. Asserted against the RUN_KIND env var at startup
  # (assert_run_kind) so a wrong config arg / RUN_ID combo fails fast before any
  # writes. config.yaml = run #2 (variant/sensitivity grid).
  run_kind: run2

  # List of (period, interval) tuples to loop over
  scenarios:
    # 10y span (was 5y) → more NON-OVERLAPPING walk-forward folds (eng-review C2:
    # more folds via longer history, NOT a sub-horizon step which would correlate
    # DM errors). ~10y @ 1d with initial_window=750 yields far more folds, which
    # also lifts SPY's underpowered significance. Keep FRED start (data.external)
    # widened to match.
    - { name: "short",  period: "10y", interval: "1d" }
    # - { name: "medium", period: "5y", interval: "1d" }
    # - { name: "long",   period: "5y", interval: "1d" }

  # Target column in your feature set
  target: "log_return"

  # Feed the past target (log_return) to neural models as an input feature.
  # false → run #0 behaviour: log_return dropped from neural X (handicapped baseline).
  # true  → run #1 behaviour: neural models receive their own past returns. Legit
  #         autoregression under the windowed 1-step-ahead eval (X[i:i+seq_len] ends
  #         at t-1 when predicting y_t), NOT look-ahead leakage. Read in two places
  #         (orchestrator X build + each model.fit) via models.feature_policy.
  # Run #2 inherits run #1: neural models receive their own past returns.
  include_past_target_as_feature: true

  # Train/test split
  test_size: 0.2        # fraction of data for test
  shuffle: false        # time‑series split must not shuffle

  # Random seed for neural model initialization — fix for reproducibility; document as limitation in thesis
  seed: 42
  # Multi-seed robustness: the full grid is run once per seed as a sub-run
  # (run_id = "{run_group_id}#s{seed}"). Point metrics are reported mean±std
  # across seeds; DM significance is reported per seed (k-of-N significant).
  # Seed 1 builds + uploads the input snapshot; later seeds load it (identical
  # inputs). Set to a single value (e.g. [42]) for a quick single-seed run.
  seeds: [42, 43, 44, 45, 46]

  # ── RUN #2: architecture/wiring variants + auto-order SARIMAX ────────────────
  # Sensitivity/ablation layer. SELF-CONTAINED: all baselines run IN-RUN so every
  # DM comparison is computed on identical folds within this run group, with no
  # dependency on cross-run snapshot merges. Classical baselines (naive, AR(1)
  # sarimax) AND the LSTM/CTRNN/NeuralODE neural baselines all run here.
  # (Previously these neural baselines were to be reused from run #1 via
  # analysis.merge_dm, but run #1's per-seed prediction snapshots collided in
  # Supabase Storage — the '#s{seed}' run_id truncated the object key — so only
  # seed 46 survived. We recompute them here instead; merge_dm is no longer on
  # the critical path. See _safe_object_token in main.py for the key fix.)
  # The #0/#1 run-lists live in git history (commits up to e5890d9).
  #
  # Launch env: INPUT_GROUP_ID=grid-2026-06-11 (pin run #0's frozen inputs, same
  # as run #1) + a NEW RUN_ID for the run #2 results group.
  #
  # Variant ids encode {mode}_{wiring}: ncp = AutoNCP sparse wiring; fc = fully-
  # connected + MLP backbone (CfC) / FullyConnected wiring (LTC).
  runs:
    # Classical baselines (in-run)
    - { model: "naive",       condition: "transformed" }
    - { model: "sarimax",     condition: "transformed" }                                          # fixed-order AR(1)
    - { model: "sarimax", variant: "ma1",    condition: "transformed", params: { order: [0, 0, 1] } }   # pure MA(1)
    - { model: "sarimax", variant: "arma11", condition: "transformed", params: { order: [1, 0, 1] } }   # ARMA(1,1) mix
    - { model: "sarimax_aic", condition: "transformed" }   # per-fold AIC search

    # CfC: {default, pure, no_gate} × {AutoNCP, FC+backbone}
    - { model: "cfc", variant: "default_ncp", condition: "transformed", params: { mode: "default", wiring: "ncp" } }
    - { model: "cfc", variant: "pure_ncp",    condition: "transformed", params: { mode: "pure",    wiring: "ncp" } }
    - { model: "cfc", variant: "no_gate_ncp", condition: "transformed", params: { mode: "no_gate", wiring: "ncp" } }
    - { model: "cfc", variant: "default_fc",  condition: "transformed", params: { mode: "default", wiring: "fc_backbone", backbone_units: 16, backbone_layers: 1 } }
    - { model: "cfc", variant: "pure_fc",     condition: "transformed", params: { mode: "pure",    wiring: "fc_backbone", backbone_units: 16, backbone_layers: 1 } }
    - { model: "cfc", variant: "no_gate_fc",  condition: "transformed", params: { mode: "no_gate", wiring: "fc_backbone", backbone_units: 16, backbone_layers: 1 } }

    # CfC: mixed_memory (LSTM-augmented) + wide backbone (T3 robustness probes)
    - { model: "cfc", variant: "default_ncp_mm",   condition: "transformed", params: { mode: "default", wiring: "ncp", mixed_memory: true } }
    - { model: "cfc", variant: "default_fc_bb128", condition: "transformed", params: { mode: "default", wiring: "fc_backbone", backbone_units: 128, backbone_layers: 1 } }

    # LTC: {AutoNCP, FullyConnected} + mixed_memory (T3)
    - { model: "ltc", variant: "ncp",    condition: "transformed", params: { wiring: "ncp" } }
    - { model: "ltc", variant: "fc",     condition: "transformed", params: { wiring: "fully_connected" } }
    - { model: "ltc", variant: "ncp_mm", condition: "transformed", params: { wiring: "ncp", mixed_memory: true } }

    # Neural baselines (in-run, recomputed for all seeds — were lost from run #1
    # storage). Standard architectures, no variant; run_key = <model>_transformed.
    - { model: "lstm",       condition: "transformed" }
    - { model: "ctrnn",      condition: "transformed" }
    - { model: "neural_ode", condition: "transformed" }



# ─── DATA SOURCES ─────────────────────────────────────────────────────────────────────────────────────────────────────
data:
  # Per-ticker feature exclusions to prevent target leakage. Names are matched
  # via FeatureBuilder.sanitize (e.g. "^GSPC" -> "gspc"). Applied before merging
  # index features into the final frame.
  feature_exclusions:
    SPY: ["^GSPC"]

  internal:
    tickers:
      - AAPL
      - SPY     # broad-market index for cross-sectional study (D3a-ceo)
      - JPM     # large-cap finance equity, sectoral contrast to AAPL (D2-codex)
      # - MSFT
      # - GOOG

    # Period and interval may be overwritten
    default_period: "10y"
    default_interval: "1d"

    # Secrets moved to .env (see .env.example). The alpha_vantage / fmp / finnhub
    # keys were unused by the active pipeline and have been removed. If you re-enable
    # one of those wrappers, read its key via os.environ there.
    sec_user_agent: "BachelorThesisExperiment/1.0 (julius.m.schmidt@stud.leuphana.de)"  # not secret; SEC_USER_AGENT in .env overrides


  external:
    fred:
      api_key: ""   # loaded from FRED_API_KEY in .env (this is only a fallback)

      series:
        # Price Indices & Inflation
        - { name: "U.S. Gross Domestic Product",   series_id: "GDP" }
        - { name: "U.S. Consumer Price Index", series_id: "CPIAUCSL"}
        - { name: "U.S. Core CPI", series_id: "CPILFESL"}
        - { name: "U.S. Personal Consumption Expenditures", series_id: "PCE"}
        - { name: "U.S. Core PCE", series_id: "PCEPI"}
        # - { name: "U.S. Leading Economic Index", series_id: "USSLIND" } # DOESN'T CONTAIN ANY DATA

        # Labor Market
        - { name: "U.S. Unemployment Rate", series_id: "UNRATE"}
        - { name: "U.S. Nonfarm Payrolls", series_id: "PAYEMS"}
        - { name: "U.S. Labor Force Participation", series_id: "CIVPART"}
        - { name: "U.S. Average Hourly Earnings", series_id: "CES3000000008"}
        # - { name: "U.S. Weekly Initial Jobless Claims", series_id: "ICSA" } # DOESN'T CONTAIN ANY DATA

        # Interest Rates & Yields
        - { name: "U.S. Federal Funds Rate", series_id: "FEDFUNDS"}
        - { name: "U.S. Treasury Yields - 1Y", series_id: "DGS1"}
        - { name: "U.S. Treasury Yields - 2Y", series_id: "DGS2"}
        - { name: "U.S. Treasury Yields - 5Y", series_id: "DGS5"}
        - { name: "U.S. Treasury Yields - 10Y", series_id: "DGS10"}
        - { name: "U.S. Treasury Yields - 30Y", series_id: "DGS30"}
        - { name: "U.S. Corporate Bonds Spread", series_id: "BAA10YM"}
        - { name: "U.S. 10Y–2Y Treasury Spread", series_id: "T10Y2Y" }

        # Production & Activity
        - { name: "U.S. Industrial Production Index", series_id: "INDPRO"}
        - { name: "U.S. Capacity Utilization (Total)", series_id: "TCU"}
        - { name: "U.S. Real Manufacturing & Trade Sales (Inflation-Adjusted)", series_id: "CMRMTSPL"}
        - { name: "U.S. Producer Price Index", series_id: "PPIACO" }

        # Retail & Consumer
        - { name: "U.S. Broad Retail Sales", series_id: "RSAFS"}
        - { name: "U.S. Corporate Profits After Tax", series_id: "CPATAX" }
        - { name: "U.S. Consumer Sentiment", series_id: "UMCSENT"}
        - { name: "U.S. Personal Savings Rate", series_id: "PSAVERT"}

        # Housing
        - { name: "U.S. Housing Starts", series_id: "HOUST"}
        - { name: "U.S. Building Permits", series_id: "PERMIT"}
        # - { name: "U.S. Existing Home Sales", series_id: "EXHOSLUSM495S"} # DOESN'T CONTAIN ENOUGH DATA
        - { name: "U.S. Case–Shiller Home Price Index", series_id: "CSUSHPINSA" }

        # Money & Credit
        - { name: "U.S. M2 Money Stock", series_id: "M2SL"}
        - { name: "U.S. Total Commercial Banks Credit", series_id: "TOTBKCR"}
        - { name: "U.S. Credit Card Delinquencies", series_id: "DRCCLACBS" }
        - { name: "U.S. Chicago Fed NFCI", series_id: "NFCI" }

        # Trade & International
        - { name: "U.S. Trade Balance", series_id: "NETEXP"}
        - { name: "U.S. Imports", series_id: "IMPGS"}
        - { name: "U.S. Exports", series_id: "EXPGS"}

        # Commodities
        - { name: "U.S. Crude Oil (WTI)", series_id: "DCOILWTICO" }
        - { name: "U.S. Gold Volatility (CBOE GVZ)", series_id: "GVZCLS" }

      # default lookback — widened to 10y to match the 10y scenario period so
      # FRED macro coverage spans the longer walk-forward history (eng-review C2).
      start: "2015-11-07"
      end: "2025-11-07"


    indices:
      - "^GSPC"       # S&P500 Index
      - "^NDX"        # Nasdaq Index
      - "^DJI"        # Dow Jones Index
      - "^GDAXI"      # DAX Index
      - "^STOXX50E"   # EuroStoxx 50 Index
      # - "^SPAS50KP" # S&P50 Asia Index / ONLY ONE DATA POINT SOMEHOW...
      - "GLD"         # Gold ETF
      - "URTH"        # iShares MSCI World ETF
      - "ACWI"        # iShares MSCI ACWI ETF



# ─── FEATURE METADATA AND PARAMETERS ──────────────────────────────────────────────────────────────────────────────────
features:
  internal:
    price:
      open:
        unit: "USD"
        transform: "none"
        description: "Opening share price for the trading day."

      high:
        unit: "USD"
        transform: "none"
        description: "Highest share price during the trading day."

      low:
        unit: "USD"
        transform: "none"
        description: "Lowest share price during the trading day."

      close:
        unit: "USD"
        transform: "none"
        description: "Closing share price at end of trading day."

      log_return:
        unit: "log-return"
        transform: "none"
        description: "Continuously compounded return between today’s and yesterday’s close."

      volume:
        unit: "shares"
        transform: "none"
        description: "Number of shares traded during the chosen timeframe."

      dividends:
        unit: "USD"
        transform: "none"
        description: "Cash dividend paid per share on that date."

      stock_splits:
        unit: "factor"
        transform: "none"
        description: "Stock split ratio applied on that date."


    info:
      sector:
        unit: "string"
        transform: "none"
        description: "GICS sector classification of the company."

      industry:
        unit: "string"
        transform: "none"
        description: "GICS industry classification of the company."


    financial_statement:
      income_q:
        gross_profit:
          unit: "USD"
          transform: "none"
          description: "Revenue minus cost of revenue."
          concept: "GrossProfit"
          alternatives:
            - "GrossProfitLoss"

        total_revenue:
          unit: "USD"
          transform: "none"
          description: "Total sales and other revenue for the period."
          concept: "RevenueFromContractWithCustomerExcludingAssessedTax"
          alternatives:
              - "Revenues"
              - "SalesRevenueNet"

        cost_of_revenue:
          unit: "USD"
          transform: "none"
          description: "Cost directly attributable to producing goods sold."
          concept: "CostOfRevenue"
          alternatives:
            - "CostOfGoodsAndServicesSold"
            - "CostOfGoodsSold"

        cost_of_goods_and_services_sold:
          unit: "USD"
          transform: "none"
          description: "The direct costs attributable to the production of the goods and services sold by the company."
          concept: "CostOfGoodsAndServicesSold"
          alternatives:
            - "CostOfRevenue"
            - "CostOfGoodsSold"

        operating_income:
          unit: "USD"
          transform: "none"
          description: "Gross profit minus operating expenses."
          concept: "OperatingIncomeLoss"
          alternatives:
            - "OperatingIncomeLossFromContinuingOperations"

        selling_general_and_administrative:
          unit: "USD"
          transform: "none"
          description: "SG&A expenses like marketing and salaries."
          concept: "SellingGeneralAndAdministrativeExpense"
          alternatives:
            - "SellingGeneralAndAdministrativeExpenses"
            - "SellingGeneralAndAdministrativeExpenseOperating"

        research_and_development:
          unit: "USD"
          transform: "none"
          description: "R&D expenses for new products/services."
          concept: "ResearchAndDevelopmentExpense"
          alternatives:
            - "ResearchAndDevelopmentExpenseExcludingImpairmentCharges"
            - "ResearchAndDevelopmentExpenseIncludingImpairmentCharges"

        operating_expenses:
          unit: "USD"
          transform: "none"
          description: "Total operating expenses excluding cost of revenue."
          concept: "OperatingExpenses"
          alternatives:
            - "OperatingCostsAndExpenses"
            - "OperatingExpensesAndOther"

        net_investment_income:
          unit: "USD"
          transform: "none"
          description: "Earnings from investments after deducting related expenses."
          concept: "NetInvestmentIncomeLoss"
          alternatives:
            - "NetInvestmentIncome"
            - "NetInvestmentIncomeLossAvailableToCommonStockholders"

        net_interest_income:
          unit: "USD"
          transform: "none"
          description: "Difference between the revenue from a firm's interest-earning assets and the expenses on its
                        interest-bearing liabilities."
          concept: "NetInterestIncome"
          alternatives:
            - "NetInterestIncomeExpense"
            - "NetInterestIncomeLoss"

        interest_expense:
          unit: "USD"
          transform: "none"
          description: "Cost of interest on borrowed funds."
          concept: "InterestExpense"
          alternatives:
            - "InterestAndDebtExpense"
            - "InterestAndOtherExpense"

        non_interest_income:
          unit: "USD"
          transform: "none"
          description: "Income from non-interest sources."
          concept: "NoninterestIncome"
          alternatives:
            - "NonInterestIncome"
            - "OtherIncomeNonOperating"

        other_non_operating_income:
          unit: "USD"
          transform: "none"
          description: "Gains or losses outside core operations."
          concept: "OtherNonoperatingIncome"
          alternatives:
            - "NonoperatingIncomeExpense"
            - "OtherIncomeExpenseNet"

        depreciation:
