# ─── WALK-FORWARD EVALUATION ──────────────────────────────────────────────────────────────────────────────────────────
walk_forward:
  initial_window: 750       # first training window (trading days, ~3 years)
  horizon: 21               # test horizon per fold (trading days, ~1 month)
  output_dir: "results/walk_forward"


# ─── PREPROCESSING CONDITIONS ─────────────────────────────────────────────────────────────────────────────────────────
preprocessing:
  warmup_discard: 20          # rows discarded from the start of BOTH conditions (rolling-window NaN warmup)
  macro_lag: 1                # publication-delay shift applied to all FRED + index columns in both conditions
  scaler:
    transformed: "zscore"     # StandardScaler for Condition 1
    raw: "minmax"             # MinMaxScaler for Condition 2


# ─── EXPERIMENT SETUP ─────────────────────────────────────────────────────────────────────────────────────────────────
experiment:
  # Self-declared run identity. Asserted against the RUN_KIND env var at startup
  # (assert_run_kind) so a wrong config arg / RUN_ID combo fails fast before any
  # writes. config.yaml = run #2 (variant/sensitivity grid).
  run_kind: run2

  # List of (period, interval) tuples to loop over
  scenarios:
    # 10y span (was 5y) → more NON-OVERLAPPING walk-forward folds (eng-review C2:
    # more folds via longer history, NOT a sub-horizon step which would correlate
    # DM errors). ~10y @ 1d with initial_window=750 yields far more folds, which
    # also lifts SPY's underpowered significance. Keep FRED start (data.external)
    # widened to match.
    - { name: "short",  period: "10y", interval: "1d" }
    # - { name: "medium", period: "5y", interval: "1d" }
    # - { name: "long",   period: "5y", interval: "1d" }

  # Target column in your feature set
  target: "log_return"

  # Feed the past target (log_return) to neural models as an input feature.
  # false → run #0 behaviour: log_return dropped from neural X (handicapped baseline).
  # true  → run #1 behaviour: neural models receive their own past returns. Legit
  #         autoregression under the windowed 1-step-ahead eval (X[i:i+seq_len] ends
  #         at t-1 when predicting y_t), NOT look-ahead leakage. Read in two places
  #         (orchestrator X build + each model.fit) via models.feature_policy.
  # Run #2 inherits run #1: neural models receive their own past returns.
  include_past_target_as_feature: true

  # Train/test split
  test_size: 0.2        # fraction of data for test
  shuffle: false        # time‑series split must not shuffle

  # Random seed for neural model initialization — fix for reproducibility; document as limitation in thesis
  seed: 42
  # Multi-seed robustness: the full grid is run once per seed as a sub-run
  # (run_id = "{run_group_id}#s{seed}"). Point metrics are reported mean±std
  # across seeds; DM significance is reported per seed (k-of-N significant).
  # Seed 1 builds + uploads the input snapshot; later seeds load it (identical
  # inputs). Set to a single value (e.g. [42]) for a quick single-seed run.
  seeds: [42]

  # ── RUN #2: architecture/wiring variants + auto-order SARIMAX ────────────────
  # Sensitivity/ablation layer. SELF-CONTAINED: all baselines run IN-RUN so every
  # DM comparison is computed on identical folds within this run group, with no
  # dependency on cross-run snapshot merges. Classical baselines (naive, AR(1)
  # sarimax) AND the LSTM/CTRNN/NeuralODE neural baselines all run here.
  # (Previously these neural baselines were to be reused from run #1 via
  # analysis.merge_dm, but run #1's per-seed prediction snapshots collided in
  # Supabase Storage — the '#s{seed}' run_id truncated the object key — so only
  # seed 46 survived. We recompute them here instead; merge_dm is no longer on
  # the critical path. See _safe_object_token in main.py for the key fix.)
  # The #0/#1 run-lists live in git history (commits up to e5890d9).
  #
  # Launch env: INPUT_GROUP_ID=grid-2026-06-11 (pin run #0's frozen inputs, same
  # as run #1) + a NEW RUN_ID for the run #2 results group.
  #
  # Variant ids encode {mode}_{wiring}: ncp = AutoNCP sparse wiring; fc = fully-
  # connected + MLP backbone (CfC) / FullyConnected wiring (LTC).
  runs:
    # Exog-robustness cell (audit follow-up): the two headline models + naive.
    - { model: "naive",   condition: "transformed" }
    - { model: "sarimax", condition: "transformed" }                                          # fixed-order AR(1)
    - { model: "cfc", variant: "pure_ncp", condition: "transformed", params: { mode: "pure", wiring: "ncp" } }



# ─── DATA SOURCES ─────────────────────────────────────────────────────────────────────────────────────────────────────
data:
  # Per-ticker feature exclusions to prevent target leakage. Names are matched
  # via FeatureBuilder.sanitize (e.g. "^GSPC" -> "gspc"). Applied before merging
  # index features into the final frame.
  feature_exclusions:
    SPY: ["^GSPC"]

  internal:
    tickers:
      - AAPL
      # - MSFT
      # - GOOG

    # Period and interval may be overwritten
    default_period: "10y"
    default_interval: "1d"

    # Secrets moved to .env (see .env.example). The alpha_vantage / fmp / finnhub
    # keys were unused by the active pipeline and have been removed. If you re-enable
    # one of those wrappers, read its key via os.environ there.
    sec_user_agent: "BachelorThesisExperiment/1.0 (julius.m.schmidt@stud.leuphana.de)"  # not secret; SEC_USER_AGENT in .env overrides


  external:
    fred:
      api_key: ""   # loaded from FRED_API_KEY in .env (this is only a fallback)

      series: []   # EXOG-ROBUSTNESS ARM: FRED macro removed (audit A1/A2)

      # default lookback — widened to 10y to match the 10y scenario period so
      # FRED macro coverage spans the longer walk-forward history (eng-review C2).
      start: "2015-11-07"
      end: "2025-11-07"


    indices:
      - "^GSPC"       # S&P500 Index
      - "^NDX"        # Nasdaq Index
      - "^DJI"        # Dow Jones Index
      - "^GDAXI"      # DAX Index
      - "^STOXX50E"   # EuroStoxx 50 Index
      # - "^SPAS50KP" # S&P50 Asia Index / ONLY ONE DATA POINT SOMEHOW...
      - "GLD"         # Gold ETF
      - "URTH"        # iShares MSCI World ETF
      - "ACWI"        # iShares MSCI ACWI ETF



